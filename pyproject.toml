[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-human-interaction-evaluation"
version = "0.1.0"
description = "Questionnaire and facial-AU evaluation of digital-human interaction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "statsmodels>=0.14.4,<0.15", "matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]
